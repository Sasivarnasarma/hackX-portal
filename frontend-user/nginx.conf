server {
    listen 80;
    
    # Enable gzip compression for assets
    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript;
    gzip_disable "MSIE [1-6]\.";

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        # For React Router to work correctly (SPA fallback)
        try_files $uri $uri/ /index.html;
    }

    # index.html references content-hashed asset filenames (e.g. index-<hash>.js),
    # so it must never be cached - otherwise a browser holding a stale copy keeps
    # pointing at an already-replaced deploy even though the new build is live.
    # try_files above re-enters location matching on its /index.html fallback,
    # so this also covers SPA routes like /jr and /x, not just literal requests
    # for /index.html.
    location = /index.html {
        root   /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    # Optional: Cache static assets
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
        root   /usr/share/nginx/html;
        expires 6M;
        access_log off;
        add_header Cache-Control "public";
    }
}
